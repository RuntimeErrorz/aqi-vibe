name = "aqi-vibe"
main = "worker.ts"
compatibility_date = "2025-02-04"

[assets]
directory = "./out"
binding = "ASSETS"

# 双 Cron 免费版配额精算（总 KV 写入 = 384 + 480 = 864 次/天 < 1,000 上限，留 13.6% 安全余量）：
# 1) 0-7,30-37 * * * *  : 每 30 分钟 8 批滚动拉完 336 切片（42 次/批，384 KV 写/天）
# 2) 9-18,39-48 * * * * : 每 30 分钟 10 批预热 40 座全球核心大都市高密度官方站（<= 44 次/批，480 KV 写/天）
[triggers]
crons = [
  "0-7,30-37 * * * *",
  "9-18,39-48 * * * *"
]

[[kv_namespaces]]
binding = "RANKING_KV"
id = "c3aefc1ad7514cc291776f5e9f4c1dd4"

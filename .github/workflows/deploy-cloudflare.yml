name: 部署至 Cloudflare Workers

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行类型检查与单元测试
        run: |
          npx tsc --noEmit
          npm test

      - name: 构建静态资源 (Static HTML Export)
        env:
          NEXT_PUBLIC_WAQI_TOKEN: ${{ secrets.NEXT_PUBLIC_WAQI_TOKEN || '' }}
          NEXT_PUBLIC_CARTO_KEY: ${{ secrets.NEXT_PUBLIC_CARTO_KEY || '' }}
        run: npm run build

      - name: 发布至 Cloudflare Workers (Assets + KV + Cron)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: 提示 Cloudflare 托管状态
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::notice::未检测到 CLOUDFLARE_API_TOKEN，测试与静态构建已通过！若已启用 Cloudflare Workers Git 直连构建，Cloudflare 控制台将自动执行构建并发布 Worker + KV + Cron。"
